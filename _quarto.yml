project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - assets/**

website:
  title: "marcocamilo"
  navbar:
    background: white
    foreground: black
    right:
      - href: index.qmd
        text: Home
      - portfolio.qmd
      - about.qmd
  page-footer:
    left: "© 2026 Marco-Andrés Camilo-Pietri"
  bread-crumbs: false
  google-analytics: "G-QQJ3PCTWK5"

format:
  html:
    theme:
      light: [default, assets/css/light-mods.scss]
      dark: [cyborg, assets/css/dark-mods.scss]
    css: /assets/css/global.css
    toc: false
    lightbox: true
    
    # code blocks
    highlight-style: github
    code-block-border-left: true
    code-fold: true
    code-summary: View Code

reference-location: margin
citation-location: margin


